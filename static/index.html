<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Azure 配音工坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <h1>Azure 配音工坊</h1>
    <span class="brand-tag">TTS · STUDIO</span>
  </div>
  <div class="topbar-right">
    <span id="connStatus" class="status-chip unknown" title="连接状态">
      <span class="dot"></span><span class="label">未连接</span>
    </span>
    <button id="settingsBtn" class="ghost-btn" title="设置">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>设置</span>
    </button>
  </div>
</header>

<main class="workspace">

  <!-- 左:音色库 -->
  <section class="panel voice-panel">
    <div class="panel-head">
      <h2>音色 <span id="voiceCount" class="panel-count">—</span></h2>
      <div class="panel-tools">
        <button id="toggleFilters" class="ghost-btn tiny" title="切换筛选条">筛选 ▾</button>
      </div>
    </div>
    <div id="filterBar" class="filter-bar hidden">
      <select id="localeFilter" class="select-mini" title="按语言筛选">
        <option value="">全部语言</option>
      </select>
      <select id="genderFilter" class="select-mini" title="按性别筛选">
        <option value="">全部性别</option>
        <option value="Female">女声</option>
        <option value="Male">男声</option>
      </select>
      <select id="typeFilter" class="select-mini" title="按类型筛选">
        <option value="">全部类型</option>
        <option value="Neural">Neural</option>
        <option value="Standard">Standard</option>
      </select>
      <label class="check-line" title="只显示支持说话风格的音色">
        <input id="styleOnly" type="checkbox" /> 仅支持风格
      </label>
      <input id="voiceSearch" class="input-mini" type="search" placeholder="搜索音色 / 名称 / 地区…" />
    </div>
    <div id="voiceList" class="voice-list">
      <div class="empty-hint">配置好设置并测试连接后,音色会出现在这里。</div>
    </div>
  </section>

  <!-- 右:合成工作台 -->
  <section class="panel studio-panel">
    <div class="panel-head">
      <h2>合成</h2>
      <div class="panel-tools">
        <span id="selectedVoiceTag" class="voice-tag">未选音色</span>
      </div>
    </div>

    <div class="studio-body">
      <textarea id="textInput" class="text-area" rows="8"
        placeholder="在此输入要朗读的文本…&#10;支持长文本,超过 1800 字会自动分段合成后拼接。"></textarea>

      <div class="param-grid">
        <div class="param">
          <label>语速 <span id="rateVal" class="param-val">默认</span></label>
          <input id="rate" type="range" min="-50" max="200" step="5" value="0" data-empty="1" />
          <div class="range-marks"><span>慢</span><span>0</span><span>快</span></div>
        </div>
        <div class="param">
          <label>音调 <span id="pitchVal" class="param-val">默认</span></label>
          <input id="pitch" type="range" min="-50" max="50" step="1" value="0" data-empty="1" />
          <div class="range-marks"><span>低</span><span>0</span><span>高</span></div>
        </div>
        <div class="param">
          <label>音量 <span id="volumeVal" class="param-val">默认</span></label>
          <input id="volume" type="range" min="-50" max="50" step="1" value="0" data-empty="1" />
          <div class="range-marks"><span>轻</span><span>0</span><span>响</span></div>
        </div>
        <div class="param param-style">
          <label>说话风格 <span class="param-hint">mstts:express-as</span></label>
          <select id="style" class="select-mini">
            <option value="">默认</option>
          </select>
        </div>
        <div class="param param-style">
          <label>角色 <span class="param-hint">role</span></label>
          <select id="role" class="select-mini">
            <option value="">默认</option>
            <option value="Girl">女孩</option>
            <option value="Boy">男孩</option>
            <option value="YoungAdultFemale">年轻女性</option>
            <option value="YoungAdultMale">年轻男性</option>
            <option value="OlderAdultFemale">年长女性</option>
            <option value="OlderAdultMale">年长男性</option>
            <option value="SeniorFemale">老年女性</option>
            <option value="SeniorMale">老年男性</option>
          </select>
        </div>
      </div>

      <div class="action-row">
        <button id="speakBtn" class="primary-btn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <span>合成</span>
        </button>
        <button id="downloadBtn" class="ghost-btn" disabled>下载音频</button>
        <span id="studioStatus" class="studio-status"></span>
      </div>
    </div>
  </section>

  <!-- 历史 -->
  <section class="panel history-panel">
    <div class="panel-head">
      <h2>历史 <span id="historyCount" class="panel-count">—</span></h2>
      <div class="panel-tools">
        <button id="selectAllHistory" class="ghost-btn tiny" title="全选/反选">全选</button>
        <button id="batchDeleteHistory" class="ghost-btn tiny danger" disabled>批量删除</button>
        <button id="refreshHistory" class="ghost-btn tiny">刷新</button>
      </div>
    </div>
    <div id="historyList" class="history-list"></div>
  </section>
</main>

<!-- 固定播放条 -->
<div id="playerBar" class="player-bar hidden">
  <button id="playToggle" class="play-btn" title="播放/暂停">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <div class="player-meta">
    <div class="player-title" id="playerTitle">—</div>
    <div class="wave" id="wave"></div>
  </div>
  <div class="player-time" id="playerTime">0:00 / 0:00</div>
</div>

<!-- 设置弹窗 -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <div class="modal-head">
      <h3>连接设置</h3>
      <button id="closeSettings" class="ghost-btn icon-only">✕</button>
    </div>
    <div class="modal-body">
      <p class="modal-hint">配置 Azure AI Speech 资源的请求地址和密钥。两者均可在 Azure Portal 资源的"密钥和终结点"页复制;也可填区域专用 TTS 域名(如 <code>https://eastus.tts.speech.microsoft.com</code>)。密钥只存在本机 <code>config.json</code>。</p>

      <label class="field">
        <span>请求地址 Endpoint</span>
        <input id="cfgEndpoint" type="text" placeholder="https://xxx.services.ai.azure.com/ 或 https://eastus.tts.speech.microsoft.com" />
        <small>带或不带尾部 <code>/</code> 均可。后端会追加 <code>/cognitiveservices/v1</code> 与 <code>/cognitiveservices/voices/list</code>。</small>
      </label>

      <label class="field">
        <span>密钥 Key</span>
        <input id="cfgKey" type="password" placeholder="Ocp-Apim-Subscription-Key" autocomplete="off" />
        <small>已保存的密钥会以 <code>abcd***wxyz</code> 形式显示,清空后再保存可覆盖。</small>
      </label>

      <label class="field">
        <span>输出格式</span>
        <select id="cfgFormat" class="select-mini">
          <option value="audio-16khz-128kbitrate-mono-mp3">MP3 · 16kHz · 128kbps · 单声道</option>
          <option value="audio-24khz-160kbitrate-mono-mp3">MP3 · 24kHz · 160kbps · 单声道</option>
          <option value="audio-48khz-192kbitrate-mono-mp3">MP3 · 48kHz · 192kbps · 单声道</option>
          <option value="riff-16khz-16bit-mono-pcm">WAV · 16kHz · 16bit · 单声道</option>
          <option value="riff-24khz-16bit-mono-pcm">WAV · 24kHz · 16bit · 单声道</option>
          <option value="ogg-24khz-16bit-mono-opus">OGG Opus · 24kHz</option>
        </select>
      </label>

      <label class="field">
        <span>默认音色</span>
        <input id="cfgDefaultVoice" type="text" placeholder="zh-CN-XiaoxiaoNeural" />
      </label>

      <div class="modal-actions">
        <button id="saveSettings" class="primary-btn">保存配置</button>
        <button id="testSettings" class="ghost-btn">测试连接</button>
        <span id="testResult" class="test-result"></span>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
